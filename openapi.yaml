# PriceLens API — generated from the Laravel code (api/). The code is the source of truth.
openapi: 3.1.0
info:
  title: PriceLens API
  version: 1.0.0
  description: 'Multi-tenant price intelligence API.


    **Authentication.** `Authorization: Bearer pl_live_{prefix}_{secret}` (API key) or a Sanctum session (dashboard / UI BFF).
    Each operation requires one ability (`x-ability`): `searches:read`, `searches:write`, `sources:write`, `monitors:write`,
    `webhooks:write` or `admin`. Dashboard users map by role: owner/admin → all; member → searches:read, searches:write, sources:write,
    monitors:write; viewer → searches:read.


    **Conventions.** ULIDs for all public ids; cursor pagination (`cursor`, `limit` ≤ 100) returning `{data, meta: {next_cursor}}`;
    money as `{amount: "329.99", currency: "USD"}`; timestamps ISO-8601 UTC.


    **Idempotency.** `Idempotency-Key` on any `POST` replays the first response for 24 h (`Idempotent-Replayed: true`).


    **Errors.** RFC 9457 `application/problem+json` with stable `type` codes.


    **Rate limits.** Per tenant (plan `api_rpm`, default 600/min) and per API key; `X-RateLimit-Limit`, `X-RateLimit-Remaining`,
    and `Retry-After` on 429. Every response carries `X-Request-Id`.'
servers:
- url: /api/v1
  description: API base path
security:
- ApiKey: []
- SanctumToken: []
- SanctumSession: []
tags:
- name: Searches
  description: Price searches, their offers, diagnostics and CSV export.
- name: Sources
  description: Tenant sources (site adapters, engines, feeds) and the global adapter library.
- name: Tracked products
  description: Catalog items and their price history.
- name: Monitors
  description: Scheduled searches for tracked products.
- name: Alerts
  description: Alerts raised by monitors.
- name: Webhooks
  description: Webhook endpoint management and delivery log.
- name: API keys
  description: API key management (admin).
- name: Usage
  description: Usage against plan limits.
- name: Auth
  description: 'Dashboard users (Sanctum): login, tokens, password reset, tenant switching.'
- name: Members
  description: Tenant membership and roles (admin).
- name: Callbacks
  description: Per-search `options.callback_url` signing secret and delivery log.
- name: Realtime
  description: Reverb (Pusher protocol) channel authorization.
- name: Health
  description: Liveness, readiness and metrics probes.
- name: Webhook events
  description: Events PriceLens POSTs to subscribed endpoints.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
      - Health
      security: []
      description: Unauthenticated.
      responses:
        '200':
          description: Alive.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      tags:
      - Health
      security: []
      description: Unauthenticated. Checks DB, cache/Redis, renderer (informational) and queue depth. Ready when DB and cache
        are OK.
      responses:
        '200':
          description: Ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /broadcasting/auth:
    post:
      operationId: authorizeBroadcastChannel
      summary: Authorize a Reverb private channel
      tags:
      - Realtime
      description: 'Pusher-protocol private-channel auth. The channel must be `private-tenant.{tenantId}.search.{searchUlid}`
        for the caller''s tenant and an existing search, otherwise 403 `forbidden` (`Channel access denied`).


        Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BroadcastAuthRequest'
      responses:
        '200':
          description: Channel authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BroadcastAuthResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches:
    get:
      operationId: listSearches
      summary: List searches
      tags:
      - Searches
      description: 'Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - queued
          - running
          - completed
          - partially_completed
          - failed
          - cancelled
      - name: created_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive lower bound on `created_at` (any parseable date).
      - name: created_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive upper bound on `created_at`.
      - name: monitor_id
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
        description: Only searches started by this monitor.
      responses:
        '200':
          description: Searches, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createSearch
      summary: Create a search
      tags:
      - Searches
      description: 'Accepts JSON or `multipart/form-data` (with an `image` upload). Returns `202` with a `Location` header.
        Subject to the monthly search quota and concurrent search limit (429 `quota_exceeded` / `concurrency_limit`). An `Idempotency-Key`
        also de-duplicates at the search level (same key → same search).


        Requires ability: `searches:write`.'
      x-ability: searches:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSearchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateSearchMultipartRequest'
            encoding:
              sources:
                contentType: application/json
              options:
                contentType: application/json
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '202':
          description: Search accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
            Location:
              $ref: '#/components/headers/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    get:
      operationId: getSearch
      summary: Get a search
      tags:
      - Searches
      description: 'Status, progress, per-source progress and stats.


        Requires ability: `searches:read`.'
      x-ability: searches:read
      responses:
        '200':
          description: The search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}/offers:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    get:
      operationId: listSearchOffers
      summary: List offers of a search
      tags:
      - Searches
      description: 'Offset-based pagination with an opaque base64 `cursor`. Responses for terminal searches are cached. `meta.stats`
        repeats the search''s summary statistics.


        Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/OffersLimit'
      - $ref: '#/components/parameters/Offer_band'
      - $ref: '#/components/parameters/Offer_availability'
      - $ref: '#/components/parameters/Offer_condition'
      - $ref: '#/components/parameters/Offer_site'
      - $ref: '#/components/parameters/Offer_min_price'
      - $ref: '#/components/parameters/Offer_max_price'
      - $ref: '#/components/parameters/Offer_sort'
      - $ref: '#/components/parameters/Offer_include_duplicates'
      - $ref: '#/components/parameters/Offer_include_outliers'
      responses:
        '200':
          description: Offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}/tasks:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    get:
      operationId: listSearchTasks
      summary: List search task diagnostics
      tags:
      - Searches
      description: 'Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - name: stage
        in: query
        required: false
        schema:
          type: string
        description: Filter by stage (`discover`, `fetch`, `render`, `extract`).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - running
          - succeeded
          - failed
          - skipped_robots
          - skipped_policy
          - blocked
          - cancelled
      responses:
        '200':
          description: Tasks (max 1000, oldest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchTaskList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}/export:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    get:
      operationId: exportSearchOffers
      summary: Export offers as CSV
      tags:
      - Searches
      description: 'Streams a CSV download (`search-{id}.csv`) with the same filters/sort as the offers list. Columns: offer_id,
        site_domain, site_name, title, url, price, list_price, shipping, total, currency, converted_total, target_currency,
        availability, condition, seller, gtin, mpn, sku, match_band, match_confidence, match_type, extraction_method, price_outlier,
        observed_at. Cells starting with `= + - @` are prefixed with `''`.


        Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          default: csv
      - $ref: '#/components/parameters/Offer_band'
      - $ref: '#/components/parameters/Offer_availability'
      - $ref: '#/components/parameters/Offer_condition'
      - $ref: '#/components/parameters/Offer_site'
      - $ref: '#/components/parameters/Offer_min_price'
      - $ref: '#/components/parameters/Offer_max_price'
      - $ref: '#/components/parameters/Offer_sort'
      - $ref: '#/components/parameters/Offer_include_duplicates'
      - $ref: '#/components/parameters/Offer_include_outliers'
      responses:
        '200':
          description: CSV stream.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Content-Disposition:
              description: '`attachment; filename=search-{id}.csv`'
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}/cancel:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    post:
      operationId: cancelSearch
      summary: Cancel a search
      tags:
      - Searches
      description: 'Cancels the batch and finalizes the search. No-op for terminal searches.


        Requires ability: `searches:write`.'
      x-ability: searches:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The (cancelled) search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /searches/{search}/rerun:
    parameters:
    - $ref: '#/components/parameters/SearchId'
    post:
      operationId: rerunSearch
      summary: Re-run a search
      tags:
      - Searches
      description: 'Creates a new search with identical input and options (quota rules apply).


        Requires ability: `searches:write`.'
      x-ability: searches:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: The new search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sources:
    get:
      operationId: listSources
      summary: List tenant sources
      tags:
      - Sources
      description: 'Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - site
          - search_engine
          - shopping_engine
          - reverse_image
          - feed
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Tenant-owned sources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: createSource
      summary: Create a source
      tags:
      - Sources
      description: 'Feed sources are refreshed in the background right after creation.


        Requires ability: `sources:write`.'
      x-ability: sources:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreateRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            Idempotent-Replayed:
              $ref: '#/components/headers/Idempotent-Replayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sources/global:
    get:
      operationId: listGlobalSources
      summary: Browse the global adapter library
      tags:
      - Sources
      description: 'Requires ability: `searches:read`.'
      x-ability: searches:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - site
          - search_engine
          - shopping_engine
          - reverse_image
          - feed
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Substring match on name or domain.
      responses:
        '200':
          description: Global adapters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /sources/{source}:
    parameters:
    - $ref: '#/components/parameters/SourceId'
    get:
      operationId: getSource
      summary: Get a source
      tags:
      - Sources
      description: 'Requires ability: `searches:read`.'
      x-ability: searches:read
      responses:
        '200':
          description: The source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      operationId: updateSource
      summary: Update a source
      tags:
      - Sources
      description: 'For global adapters only `enabled` (tenant opt-in/out) may be changed; anything else → 403 `global_source_read_only`.


        Requires ability: `sources:write`.'
      x-ability: sources:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteSource
      summary: Delete a source
      tags:
      - Sources
      description: 'Requires ability: `sources:write`.'
      x-ability: sources:write
      responses:
        '204':
          description: Deleted.
          headers:
            X-Request-Id:
