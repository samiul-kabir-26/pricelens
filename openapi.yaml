              $ref: '#/components/schemas/Event_quota_threshold'
      responses:
        2XX:
          description: Delivered.
        '410':
          description: Endpoint gone; PriceLens disables the endpoint.
        default:
          description: Any other status (or network error) is retried.
  ping:
    post:
      operationId: webhook_ping
      summary: ping
      description: 'Test event from `POST /webhooks/{id}/test`; sent to every endpoint regardless of subscription.


        Delivered as `POST` with `Content-Type: application/json`, no redirects followed, 10 s timeout. Any 2xx = delivered.
        Otherwise retried with backoff 1m, 5m, 15m, 1h, 3h, 6h, 12h, 24h (max 8 attempts). `410 Gone` disables the endpoint
        immediately; 50 consecutive failures auto-disable it.'
      tags:
      - Webhook events
      security: []
      parameters:
      - name: X-PriceLens-Event
        in: header
        required: true
        description: Event name.
        schema:
          $ref: '#/components/schemas/WebhookEventName'
      - name: X-PriceLens-Delivery
        in: header
        required: true
        description: Delivery id (ULID); new per redelivery.
        schema:
          $ref: '#/components/schemas/Ulid'
      - name: X-PriceLens-Timestamp
        in: header
        required: true
        description: Unix seconds at send time. Reject if older than 5 minutes.
        schema:
          type: string
          pattern: ^\d+$
      - name: X-PriceLens-Signature
        in: header
        required: true
        description: '`v1=<hex(HMAC_SHA256(secret, timestamp + "." + raw_body))>`. May contain several comma-separated signatures;
          accept if any matches.'
        schema:
          type: string
          pattern: ^v1=[0-9a-f]{64}
      - name: User-Agent
        in: header
        required: false
        schema:
          type: string
          const: PriceLens-Webhooks/1.0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event_ping'
      responses:
        2XX:
          description: Delivered.
        '410':
          description: Endpoint gone; PriceLens disables the endpoint.
        default:
          description: Any other status (or network error) is retried.
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: pl_live_{prefix}_{secret}
      description: Tenant API key. Invalid or revoked keys → 401.
    SanctumToken:
      type: http
      scheme: bearer
      description: Sanctum personal access token from `POST /auth/token` (dashboard users; abilities by role).
    SanctumSession:
      type: apiKey
      in: cookie
      name: pricelens_session
      description: Sanctum SPA session cookie from `POST /auth/login` (stateful origins only).
    MetricsToken:
      type: http
      scheme: bearer
      description: Static `PRICELENS_METRICS_TOKEN` for `/metrics` (only when configured).
  schemas:
    Ulid:
      type: string
      description: Public identifier (ULID, Crockford base32, 26 chars).
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      examples:
      - 01JB7K2M4X9Q8T6V5R3N1P0WZY
    DateTime:
      type: string
      format: date-time
      description: ISO-8601 UTC timestamp (Zulu), e.g. `2026-11-01T09:14:22Z`.
    Money:
      type: object
      description: Monetary amount. Serialized by `App\Support\Money::toArray`, which returns `null` when the amount or currency
        is missing; nullable usages wrap this schema.
      properties:
        amount:
          type: string
          description: Decimal string in major units (never a float), e.g. `329.99`.
          pattern: ^-?[0-9]+(\.[0-9]+)?$
          examples:
          - '329.99'
        currency:
          type: string
          description: ISO 4217 code.
          minLength: 3
          maxLength: 3
          examples:
          - USD
      required:
      - amount
      - currency
    ConvertedMoney:
      allOf:
      - $ref: '#/components/schemas/Money'
      - type: object
        properties:
          fx_rate_date:
            type:
            - string
            - 'null'
            format: date
            description: Date of the FX rate used for conversion.
        required:
        - fx_rate_date
      description: Money converted into the search's `target_currency`.
    ListMeta:
      type: object
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque cursor for the next page; `null` on the last page.
      required:
      - next_cursor
    Problem:
      type: object
      description: RFC 9457 problem details (`application/problem+json`).
      properties:
        type:
          type: string
          format: uri
          description: 'Stable error type URI: `{PRICELENS_ERRORS_BASE_URL}{code}` (default base `https://docs.pricelens.dev/errors/`).
            Codes include `validation_failed`, `unauthenticated`, `forbidden`, `no_tenant`, `tenant_suspended`, `feature_unavailable`,
            `global_source_read_only`, `not_found`, `rate_limited`, `quota_exceeded`, `concurrency_limit`, `invalid_idempotency_key`,
            `idempotency_conflict`, `idempotency_mismatch`, `server_error`, `http_{status}`.'
          examples:
          - https://docs.pricelens.dev/errors/quota_exceeded
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          description: Request path, e.g. `/api/v1/searches`.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Present on `validation_failed` (422). Keys use dot notation, e.g. `options.max_results`.
      required:
      - type
      - title
      - status
    SearchEngineSelection:
      type: object
      properties:
        provider:
          type: string
          enum:
          - serpapi
          - brave
          - google_vision
        mode:
          type: string
          enum:
          - web
          - shopping
        scope:
          type:
          - string
          - 'null'
          enum:
          - open
          - allowed_domains
          - null
        verify:
          type:
          - boolean
          - 'null'
      required:
      - provider
      - mode
    SearchSourcesInput:
      type: object
      description: Sources to query. Total count is capped by the plan's `max_sources_per_search`.
      properties:
        source_ids:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Ulid'
          maxItems: 100
          description: Tenant-owned sources or enabled global sources.
        domains:
          type:
          - array
          - 'null'
          items:
            type: string
            description: Hostname.
          maxItems: 100
          description: Ad-hoc domains; entries matching the tenant blocklist are silently dropped.
        search_engines:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SearchEngineSelection'
          maxItems: 10
          description: Requires the `search-engines` plan feature.
        reverse_image:
          type:
          - boolean
          - 'null'
          description: Requires the `image-search` plan feature.
    SearchOptionsInput:
      type: object
      properties:
        country:
          type:
          - string
          - 'null'
          minLength: 2
          maxLength: 2
          pattern: ^[A-Za-z]{2}$
        language:
          type:
          - string
          - 'null'
          pattern: ^[a-z]{2}(-[A-Za-z]{2})?$
        target_currency:
          type:
          - string
          - 'null'
          minLength: 3
          maxLength: 3
          description: ISO 4217 code.
        condition:
          type:
          - string
          - 'null'
          enum:
          - new
          - refurbished
          - used
          - any
          - null
        max_results:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Maximum is the plan's `max_results_per_search` (default 500).
        include_possible:
          type:
          - boolean
          - 'null'
        min_confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        fresh:
          type:
          - boolean
          - 'null'
        callback_url:
          type:
          - string
          - 'null'
          format: uri
          description: Public http(s) URL.
    SearchOptions:
      type: object
      description: Options after tenant defaults and plan limits are applied (null values omitted).
      properties:
        country:
          type: string
        language:
          type: string
        target_currency:
          type: string
        condition:
          type: string
          enum:
          - new
          - refurbished
          - used
          - any
        max_results:
          type: integer
        include_possible:
          type: boolean
        min_confidence:
          type: number
        fresh:
          type: boolean
        callback_url:
          type: string
        max_candidates_per_source:
          type: integer
      additionalProperties: true
    CreateSearchRequest:
      type: object
      description: At least one of `title`, `image_url`/`image`, `gtin`, `mpn` or `reference_url` is required.
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 500
        gtin:
          type:
          - string
          - 'null'
          description: GTIN-8/12/13/14 with a valid check digit.
        mpn:
          type:
          - string
          - 'null'
          maxLength: 100
        brand:
          type:
          - string
          - 'null'
          maxLength: 100
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Public http(s) URL.
        reference_url:
          type:
          - string
          - 'null'
          format: uri
          description: Public http(s) URL.
        sources:
          oneOf:
          - $ref: '#/components/schemas/SearchSourcesInput'
          - type: 'null'
        options:
          oneOf:
          - $ref: '#/components/schemas/SearchOptionsInput'
          - type: 'null'
    CreateSearchMultipartRequest:
      type: object
      description: 'Multipart variant of `CreateSearchRequest`: nested objects are sent as JSON strings.'
      properties:
        title:
          type: string
          maxLength: 500
        gtin:
          type: string
        mpn:
          type: string
          maxLength: 100
        brand:
          type: string
          maxLength: 100
        image_url:
          type: string
          format: uri
        image:
          type: string
          format: binary
          contentMediaType: application/octet-stream
          description: JPEG, PNG or WebP, at most 10 MB. Requires the `image-search` plan feature.
        reference_url:
          type: string
          format: uri
        sources:
          type: string
          description: JSON-encoded `SearchSourcesInput`.
        options:
          type: string
          description: JSON-encoded `SearchOptionsInput`.
    SearchInput:
      type: object
      description: The request input as submitted (null/empty values dropped; upload paths removed).
      properties:
        title:
          type: string
        gtin:
          type: string
        mpn:
          type: string
        brand:
          type: string
        image_url:
          type: string
        reference_url:
          type: string
        sources:
          $ref: '#/components/schemas/SearchSourcesInput'
      additionalProperties: true
    ProductQuery:
      type: object
      description: Normalized search input (`image_path` and `visual_matches` are never exposed).
      properties:
        title:
          type:
          - string
          - 'null'
        cleaned_title:
          type:
          - string
          - 'null'
        tokens:
          type: array
          items:
            type: string
        brand:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
        gtin:
          type:
          - string
          - 'null'
        mpn:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        image_phash:
          type:
          - string
          - 'null'
        attributes:
          type: object
          additionalProperties:
            type:
            - string
            - integer
          description: Parsed attributes (storage, size, color, pack).
        condition:
          type:
          - string
          - 'null'
        labels:
          type: array
          items:
            type: string
        reference_url:
          type:
          - string
          - 'null'
      required:
      - title
      - cleaned_title
      - tokens
      - brand
      - model
      - gtin
      - mpn
      - image_url
      - image_phash
      - attributes
      - condition
      - labels
      - reference_url
    Stats:
      type: object
      description: Summary over in-stock exact/likely, non-duplicate, non-outlier offers in the target currency. Amounts are
        decimal strings; all `null` when there are no qualifying offers.
      properties:
        currency:
          type:
          - string
          - 'null'
          description: The search's target currency.
        min:
          type:
          - string
          - 'null'
        p25:
          type:
          - string
          - 'null'
        median:
          type:
          - string
          - 'null'
        p75:
          type:
          - string
          - 'null'
        max:
          type:
          - string
          - 'null'
        mean:
          type:
          - string
          - 'null'
        offer_count:
          type: integer
        site_count:
          type: integer
        cheapest_offer_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
      required:
      - currency
      - min
      - p25
      - median
      - p75
      - max
      - mean
      - offer_count
      - site_count
      - cheapest_offer_id
    SearchSourceStatus:
      type: object
      description: Per-source progress of a search.
      properties:
        source_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        name:
          type:
          - string
          - 'null'
        domain:
          type:
          - string
          - 'null'
        type:
          type: string
          enum:
          - site
          - search_engine
          - shopping_engine
          - reverse_image
          - feed
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - partially_completed
          - failed
          - cancelled
        candidates_found:
          type: integer
        offers_found:
          type: integer
        error:
          type:
          - string
          - 'null'
      required:
      - source_id
      - name
      - domain
      - type
      - status
      - candidates_found
      - offers_found
      - error
    Search:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partially_completed
          - failed
          - cancelled
        input:
          $ref: '#/components/schemas/SearchInput'
        product_query:
          oneOf:
          - $ref: '#/components/schemas/ProductQuery'
          - type: 'null'
        options:
          $ref: '#/components/schemas/SearchOptions'
        target_currency:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        progress:
          type: object
          properties:
            total:
              type: integer
            done:
              type: integer
          required:
          - total
          - done
        stats:
          oneOf:
          - $ref: '#/components/schemas/Stats'
          - type: 'null'
        error:
          type:
          - string
          - 'null'
          description: e.g. `no_sources`, `all_tasks_failed`.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SearchSourceStatus'
        monitor_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        completed_at:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        created_at:
          oneOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        links:
          type: object
          properties:
            self:
              type: string
            offers:
              type: string
            image:
              type: string
              description: Present when the search has an input image; redirects to a short-lived signed URL.
          required:
          - self
          - offers
        realtime:
          type: object
          properties:
            channel:
              type: string
              description: Reverb private channel, `private-tenant.{tenantId}.search.{searchUlid}`.
          required:
          - channel
      required:
      - id
      - status
