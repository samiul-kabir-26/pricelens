  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `meta.next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size (1–100, default 25; out-of-range values are clamped).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    OffersLimit:
      name: limit
      in: query
      required: false
      description: Page size (1–100, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the first response for 24 h for the same tenant, method and path. Max 255 chars. Reusing a key
        with a different body → 422 `idempotency_mismatch`; concurrent use → 409.
      schema:
        type: string
        maxLength: 255
    SearchId:
      name: search
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    MemberId:
      name: member
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: User id.
    SourceId:
      name: source
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TrackedProductId:
      name: trackedProduct
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    MonitorId:
      name: monitor
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AlertId:
      name: alert
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    WebhookId:
      name: webhook
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    DeliveryId:
      name: delivery
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ApiKeyId:
      name: apiKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    IncludePayload:
      name: include_payload
      in: query
      required: false
      description: Include the event envelope in `payload`.
      schema:
        type: boolean
    Offer_band:
      name: band
      in: query
      description: 'Comma-separated match bands (`exact,likely,possible,rejected`). Default: `exact,likely` (+`possible` when
        the search set `include_possible`), filtered by `min_confidence`.'
      schema:
        type: string
        maxLength: 64
      required: false
    Offer_availability:
      name: availability
      in: query
      description: Comma-separated availability values.
      schema:
        type: string
        maxLength: 128
      required: false
    Offer_condition:
      name: condition
      in: query
      description: Comma-separated condition values.
      schema:
        type: string
        maxLength: 64
      required: false
    Offer_site:
      name: site
      in: query
      description: Comma-separated site domains.
      schema:
        type: string
        maxLength: 255
      required: false
    Offer_min_price:
      name: min_price
      in: query
      description: Minimum converted total (target currency).
      schema:
        type: number
        minimum: 0
      required: false
    Offer_max_price:
      name: max_price
      in: query
      description: Maximum converted total (target currency).
      schema:
        type: number
        minimum: 0
      required: false
    Offer_sort:
      name: sort
      in: query
      description: Default `rank` (band, non-outliers, in stock, cheapest converted total).
      schema:
        type: string
        enum:
        - price
        - -price
        - total_price
        - -total_price
        - confidence
        - -confidence
        - site
        - -site
        - observed_at
        - -observed_at
        - rank
        default: rank
      required: false
    Offer_include_duplicates:
      name: include_duplicates
      in: query
      schema:
        type: boolean
        default: false
      required: false
    Offer_include_outliers:
      name: include_outliers
      in: query
      description: Outliers are included unless this is explicitly `false`.
      schema:
        type: boolean
      required: false
  headers:
    X-Request-Id:
      description: Request correlation id (echoes a valid inbound `X-Request-Id`, else a generated UUID).
      schema:
        type: string
    X-RateLimit-Limit:
      description: Requests allowed per minute.
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    Idempotent-Replayed:
      description: '`true` when this response was replayed for a repeated `Idempotency-Key`.'
      schema:
        type: string
        enum:
        - 'true'
    Location:
      description: URL of the created search.
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid `Idempotency-Key` (`invalid_idempotency_key`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/invalid_idempotency_key
            title: Invalid Idempotency-Key
            status: 400
            instance: /api/v1/searches
    Unauthenticated:
      description: Missing, invalid or revoked API key (`unauthenticated`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/unauthenticated
            title: Authentication required
            status: 401
            instance: /api/v1/searches
    Forbidden:
      description: Missing ability (`forbidden`), no active tenant (`no_tenant`), suspended tenant (`tenant_suspended`) or
        plan feature unavailable (`feature_unavailable`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/forbidden
            title: Missing ability
            status: 403
            instance: /api/v1/searches
    NotFound:
      description: Resource not found or belongs to another tenant (`not_found`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/not_found
            title: Resource not found
            status: 404
            instance: /api/v1/searches
    Conflict:
      description: A request with the same `Idempotency-Key` is still in progress (`idempotency_conflict`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/idempotency_conflict
            title: Request in progress
            status: 409
            instance: /api/v1/searches
    ValidationFailed:
      description: Validation failed (`validation_failed`, with `errors`) or `Idempotency-Key` reused with a different request
        (`idempotency_mismatch`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/validation_failed
            title: The request is invalid
            status: 422
            detail: The options.max_results field must not be greater than 500.
            instance: /api/v1/searches
            errors:
              options.max_results:
              - The options.max_results field must not be greater than 500.
    TooManyRequests:
      description: Rate limited (`rate_limited`), or plan quota/concurrency exceeded (`quota_exceeded`, `concurrency_limit`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.pricelens.dev/errors/rate_limited
            title: Too many requests
            status: 429
            detail: Rate limit exceeded; retry after the time given in Retry-After.
            instance: /api/v1/searches
