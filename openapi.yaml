      - options
      - target_currency
      - country
      - progress
      - stats
      - error
      - sources
      - monitor_id
      - started_at
      - completed_at
      - created_at
      - links
      - realtime
    Offer:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        site:
          type: object
          properties:
            domain:
              type: string
            name:
              type:
              - string
              - 'null'
          required:
          - domain
          - name
        url:
          type: string
        title:
          type:
          - string
          - 'null'
        image_url:
          type:
          - string
          - 'null'
        price:
