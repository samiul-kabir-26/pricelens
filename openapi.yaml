          examples:
          - in_stock
          - out_of_stock
          - preorder
          - backorder
          - limited
          - discontinued
          - unknown
        condition:
          type: string
          description: Normalized condition.
          examples:
          - new
          - used
          - refurbished
          - unknown
        seller:
          type:
          - string
          - 'null'
        brand:
          type:
          - string
          - 'null'
        rating:
          type:
          - number
          - 'null'
        review_count:
          type:
          - integer
          - 'null'
        variant:
          type:
          - object
          - 'null'
