      - image_url
      - price
      - list_price
      - shipping
      - total
      - converted_total
      - availability
      - condition
      - seller
      - brand
      - rating
      - review_count
      - variant
      - identifiers
      - match
      - extraction_method
      - price_outlier
      - is_duplicate
      - observed_at
    SearchTask:
      type: object
