# Shared by every generated shop server block (see sites.conf, generated by generate.py).
default_type text/html;
charset utf-8;
add_header Cache-Control "public, max-age=60" always;

# /search?q=... -> the per-product results page picked by the $fixture_search_slug map, else all products.
location = /search {
    try_files /search/$fixture_search_slug.html /search/index.html =404;
}
location /search/ { internal; }

# Extension-less product URLs (/p/<slug>) so the generic `/p/<slug>` product pattern matches.
location /p/ {
    try_files $uri $uri.html =404;
}

location = /robots.txt  { default_type text/plain; }
location = /sitemap.xml { default_type application/xml; }
location = /catalog.json { default_type application/json; add_header Access-Control-Allow-Origin * always; }
location /img/ { default_type image/png; expires 1h; }

location = /cart { return 302 /; }

location / {
    try_files $uri $uri/index.html $uri.html =404;
}
