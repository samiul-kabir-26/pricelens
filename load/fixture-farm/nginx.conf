# Fixture farm: one nginx serving every generated shop by Host header.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    server_tokens off;
    access_log off; # 200 VUs x 5 domains would drown the logs; set to /dev/stdout when debugging.

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Unknown hosts: 404, plus a health endpoint for compose/k6.
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { return 404; }
    }

    include /etc/nginx/fixture/sites.conf;
}
