# Local/dev single host on :80. Production TLS + split hosts: see docker/nginx/prod.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Re-resolve container names (Docker DNS) so recreated containers don't leave stale upstream IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/api/public;

    # Laravel: /api/v1 (the UI BFF owns the rest of /api/*), broadcasting auth, health, metrics, Horizon dashboard (local only by Horizon gate).
    # /api/v1 is Laravel; the rest of /api/* belongs to the Next.js BFF route handlers.
    location ~ ^/(api/v1|broadcasting|up|metrics|horizon|sanctum)(/|$) {
        try_files $uri /index.php?$query_string;
    }
    location /vendor/horizon/ { try_files $uri =404; }

    location = /index.php {
        set $php_api api:9000;
        fastcgi_pass $php_api;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    # Reverb (Pusher protocol): websocket at /app/{key}, HTTP API at /apps/...
    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        set $reverb_ws reverb:8080;
        proxy_pass http://$reverb_ws;
    }

    # Everything else: the Next.js demo UI.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # streamed CSV exports through the BFF
        set $web_ui web:3000;
        proxy_pass http://$web_ui;
    }
}
