# Production: TLS termination, api / ws / ui hosts. Certificates mounted at /etc/nginx/certs.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Re-resolve container names (Docker DNS) so recreated containers don't leave stale upstream IPs.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pricelens.example;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/api/public;
    index index.php;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        set $php_api api:9000;
        fastcgi_pass $php_api;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 30s;
    }

    # Metrics only from the internal network.
    location = /metrics { allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all; try_files $uri /index.php?$query_string; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ws.pricelens.example;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $reverb_ws reverb:8080;
        proxy_pass http://$reverb_ws;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.pricelens.example;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        set $web_ui web:3000;
        proxy_pass http://$web_ui;
    }
}
