# Observability overlay: Prometheus + Grafana + OpenTelemetry Collector.
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Grafana:    http://localhost:3001  (anonymous Viewer; admin login with GRAFANA_ADMIN_PASSWORD, default "admin")
# Prometheus: http://localhost:9090  (targets, alerts)
# Traces:     docker compose logs -f otel-collector  (debug exporter; see docker/observability/otel-collector.yaml)
# Combine with the load-test overlay by adding `-f docker-compose.loadtest.yml`.

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

services:
  api:
    environment: *otel-env
  horizon:
    environment: *otel-env
  renderer:
    environment: *otel-env

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./docker/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Internal only: 4318 (OTLP/HTTP), 4317 (OTLP/gRPC), 8888 (own metrics), 13133 (health).
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    # Writes the optional /metrics bearer token to a tmpfs file, read through `credentials_file`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${PRICELENS_METRICS_TOKEN:-unset}" > /etc/prometheus/secrets/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$${PROMETHEUS_RETENTION:-7d} \
          --web.enable-lifecycle
    environment:
      PRICELENS_METRICS_TOKEN: ${PRICELENS_METRICS_TOKEN:-}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
      - type: tmpfs
        target: /etc/prometheus/secrets
        tmpfs:
          size: 65536
          mode: 01777
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [nginx, otel-collector]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pricelens-pipeline.json
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
